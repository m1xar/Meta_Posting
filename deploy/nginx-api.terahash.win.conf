map $request_method $raze_media_source {
    default "";
    POST $binary_remote_addr;
}

limit_conn_zone $raze_media_source zone=raze_media_connections:10m;
limit_req_zone $raze_media_source zone=raze_media_requests:10m rate=60r/m;

server {
    server_name api.terahash.win;

    # JSON endpoints are bounded separately from the large media route below.
    client_max_body_size 16m;

    # OAuth redirects carry a short-lived authorization code and opaque state in
    # the query string. Never persist that request target in either Nginx log,
    # including when the upstream is unavailable.
    location = /oauth/facebook/callback {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /v1/media {
        # One 1 GiB file plus up to 8 MiB of multipart envelope.
        client_max_body_size 1032m;

        # Bound expensive streaming uploads per source without imposing a
        # transfer-rate limit on an accepted 1 GiB / 30-minute request.
        limit_conn raze_media_connections 4;
        limit_conn_status 429;
        limit_req zone=raze_media_requests burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Stream uploads to the API instead of first duplicating up to 1 GiB
        # into Nginx's client-body temporary storage.
        proxy_request_buffering off;
        client_body_timeout 30m;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.terahash.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.terahash.win/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.terahash.win) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.terahash.win;
    return 404;
}
