<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad account · Raze Posting</title><link rel="stylesheet" href="/static/app.css"></head><body><header></header><main class="shell"><section class="hero"><div><h1 id="title">Ad account</h1><p id="subtitle" class="muted"></p></div><a class="button" href="/app">← Dashboard</a></section>
<section class="cards" id="totals"></section>
<section class="panel"><h2>Кампании этого кабинета</h2><div id="table"></div></section>
</main><script src="/static/app.js"></script><script>
const accountID=location.pathname.split('/').pop();
let state=null;
async function load(){
state=await api('/app/api/accounts/'+accountID+'/stats');
renderHeader('',state.user);
const a=state.account||{};
document.querySelector('#title').textContent=a.name||a.account_id||'Ad account';
document.title=(a.name||'Ad account')+' · Raze Posting';
document.querySelector('#subtitle').textContent=[a.meta_ad_account_id,a.currency,a.timezone_name,(a.account_status===1?'Active':'Status '+a.account_status)].filter(Boolean).join(' · ');
document.querySelector('#totals').innerHTML=totalsCards(state.totals||{},[['Balance',fmtNum(a.balance_minor),'minor units'],['Spent (FB lifetime)',fmtNum(a.amount_spent_minor),'minor units']]);
document.querySelector('#table').innerHTML=campaignTable(state.campaigns||[],{withActions:true});
document.querySelectorAll('#table [data-action]').forEach(btn=>btn.onclick=async()=>{
if(btn.dataset.action==='guard'){location='/app/campaigns';return}
btn.disabled=true;
try{await api('/app/api/campaigns/'+btn.dataset.id+'/'+btn.dataset.action,{method:'POST'});await load()}catch(err){btn.disabled=false;btn.title=err.message}
});
}
load();setInterval(load,60000);
</script></body></html>
