<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launcher · Raze Posting</title><link rel="stylesheet" href="/static/app.css"></head><body><header></header><main class="shell"><section class="hero"><div><h1>Launcher</h1><p>Один батч — одна иерархия Campaign → Ad Set → Creative → Ad, залитая сразу во все выбранные кабинеты, с чекпоинт-правилами по новой логике.</p></div></section>
<section class="grid">
<article class="panel" style="grid-column:span 8">
<h2>Кампания</h2>
<form id="campaign" class="form-grid">
<label class="field wide">Connection<select name="connection_id" required></select></label>
<label class="field wide">Batch name<input name="name" placeholder="0826_DE_offer_1" required></label>
<label class="field">Objective<select name="objective"><option>OUTCOME_SALES</option><option>OUTCOME_TRAFFIC</option><option>OUTCOME_LEADS</option><option>OUTCOME_ENGAGEMENT</option><option>OUTCOME_AWARENESS</option><option>OUTCOME_APP_PROMOTION</option></select></label>
<label class="field">Daily budget (minor units)<input name="budget" type="number" min="1" value="1000" required></label>
<label class="field">Country<input name="country" value="DE" maxlength="2" required></label>
<label class="field">Leave paused<select name="leave_paused"><option value="false">No — activate</option><option value="true">Yes — safe test</option></select></label>
<label class="field wide">Page<select name="page_id" required><option value="">Select a synced Page</option></select></label>
<label class="field wide">Landing URL (трекер-ссылка Keitaro)<input name="link" type="url" placeholder="https://domain/?sub_id_3={{campaign.name}}&sub_id_7={{campaign.id}}" required></label>
<label class="field wide">Primary text<textarea name="message" required></textarea></label>
<label class="field wide">Headline<input name="headline" value="Learn more" required></label>
<label class="field wide">Media<input name="file" type="file" accept="image/*,video/*"></label>
<label class="field">Media type<select name="kind"><option value="image">Image</option><option value="video">Video</option></select></label>
<div class="field full"><h2 style="margin:14px 0 4px">Чекпоинты (авто-стоп)</h2><div id="checkpoints"></div></div>
<div class="field full"><div class="actions"><button class="primary">Queue batch</button><span id="campaign-status" class="status"></span></div></div>
</form>
</article>
<article class="panel" style="grid-column:span 4">
<h2>Ad accounts</h2>
<input id="search" placeholder="Filter accounts" style="margin-bottom:10px">
<div class="scroll" style="max-height:420px"><table><thead><tr><th></th><th>Account</th><th>Cur</th><th>Status</th></tr></thead><tbody id="accounts"></tbody></table></div>
<h2 style="margin-top:22px">Recent batches</h2>
<div id="batches" class="list"></div>
</article>
</section></main><script src="/static/app.js"></script><script>
let state=null,getCheckpoints=null;
async function load(){state=await api('/app/api/launcher');renderHeader('launch',state.user);render()}
function render(){
document.querySelectorAll('select[name=connection_id]').forEach(sel=>sel.replaceChildren(...(state.connections||[]).map(c=>new Option(c.display_name||c.meta_user_id,c.id))));
renderPages();renderAccounts();renderBatches();
if(!getCheckpoints)getCheckpoints=checkpointEditor(document.querySelector('#checkpoints'),[{spend:5,min_tracker_clicks:20},{spend:15,min_tracker_leads:1},{spend:40,min_tracker_sales:1}]);
}
function currentConnection(){return document.querySelector('#campaign [name=connection_id]').value}
function renderPages(){const pageSelect=document.querySelector('#campaign [name=page_id]');pageSelect.replaceChildren(new Option('Select a synced Page',''),...(state.assets||[]).filter(a=>a.asset_type==='page'&&a.connection_id===currentConnection()).map(a=>new Option(a.name||a.meta_asset_id,a.meta_asset_id)))}
function renderAccounts(){const q=(document.querySelector('#search').value||'').toLowerCase();document.querySelector('#accounts').innerHTML=(state.ad_accounts||[]).filter(a=>a.connection_id===currentConnection()&&((a.name||'')+' '+a.account_id).toLowerCase().includes(q)).map(a=>'<tr><td><input type="checkbox" class="checkbox account-select" value="'+a.id+'"></td><td>'+esc(a.name||a.account_id)+'</td><td>'+esc(a.currency)+'</td><td>'+(a.account_status===1&&a.is_active?'<span class="pill live">OK</span>':'<span class="pill failed">N/A</span>')+'</td></tr>').join('')}
function renderBatches(){const wrap=document.querySelector('#batches');wrap.innerHTML=(state.batches||[]).slice(0,10).map(b=>'<div class="rowitem"><div class="row"><strong>'+esc(b.name||b.id)+'</strong><span class="pill">'+esc(b.status)+'</span></div><div class="muted">'+b.succeeded_accounts+'/'+b.total_accounts+' accounts ok</div></div>').join('')||'<span class="muted">Батчей ещё нет.</span>'}
document.querySelector('#search').oninput=renderAccounts;
document.addEventListener('change',e=>{if(e.target.name==='connection_id'){renderPages();renderAccounts()}});
document.querySelector('#campaign').onsubmit=async e=>{
e.preventDefault();const out=document.querySelector('#campaign-status');const f=new FormData(e.currentTarget);
const accountIds=[...document.querySelectorAll('.account-select:checked')].map(x=>x.value);
if(!accountIds.length){out.textContent='Выбери хотя бы один кабинет';return}
const checkpoints=getCheckpoints();
let mediaId='';
const file=f.get('file');
try{
if(file&&file.size){out.textContent='Uploading media…';const mf=new FormData();mf.append('connection_id',currentConnection());mf.append('kind',f.get('kind'));mf.append('file',file);const media=await api('/app/api/media',{method:'POST',body:mf});mediaId=media.id}
const hierarchy={campaign:{name:f.get('name'),objective:f.get('objective'),special_ad_categories:[]},ad_set:{name:f.get('name')+' / Ad set',billing_event:'IMPRESSIONS',optimization_goal:f.get('objective')==='OUTCOME_TRAFFIC'?'LINK_CLICKS':'OFFSITE_CONVERSIONS',destination_type:'WEBSITE',daily_budget:Number(f.get('budget')),targeting:{age_min:18,age_max:65,geo_locations:{countries:[f.get('country').toUpperCase()]},publisher_platforms:['facebook','instagram']}},creative:{name:f.get('name')+' / Creative',object_story_spec:{page_id:f.get('page_id'),link_data:{link:f.get('link'),message:f.get('message'),name:f.get('headline'),call_to_action:{type:'LEARN_MORE',value:{link:f.get('link')}}}}},ad:{name:f.get('name')+' / Ad'}};
const batch={connection_id:currentConnection(),name:f.get('name'),ad_account_ids:accountIds,idempotency_key:crypto.randomUUID(),hierarchy,leave_paused:f.get('leave_paused')==='true',media_bindings:mediaId?[{media_id:mediaId,target:'/creative/object_story_spec/link_data/image_hash'}]:[]};
out.textContent='Queueing…';
const result=await api('/app/api/batches',{method:'POST',body:{batch,checkpoints}});
out.textContent='Queued batch '+result.batch.id+(result.guard?' + guard':'');
await load();
}catch(err){out.textContent=err.message}
};
load();
</script></body></html>
