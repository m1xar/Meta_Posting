<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaigns · Raze Posting</title><link rel="stylesheet" href="/static/app.css"></head><body><header></header><main class="shell"><section class="hero"><div><h1>Campaigns</h1><p>Все запуски со статусами, метриками Facebook + Keitaro и чекпоинт-правилами. Правила можно менять на лету, кампании — паузить и возобновлять.</p></div><a class="button primary" href="/app/launch">+ Launch</a></section>
<section class="cards" id="totals"></section>
<section class="panel"><div class="row"><h2>Все кампании</h2><div class="actions"><select id="filter" style="width:auto"><option value="">All statuses</option><option value="live">Live</option><option value="paused">Paused</option></select><input id="search" placeholder="Search" style="width:220px"></div></div><div id="table"></div></section>
<dialog id="guard-dialog"><h2 id="guard-title">Guard</h2><p class="muted" id="guard-scope"></p><div id="guard-editor"></div><div class="actions" style="margin-top:16px"><button class="primary" id="guard-save">Save</button><button id="guard-cancel">Cancel</button><span id="guard-status" class="status"></span></div></dialog>
<script src="/static/app.js"></script><script>
let state=null,getCheckpoints=null,dialogTarget=null;
async function load(){state=await api('/app/api/campaigns');renderHeader('campaigns',state.user);render()}
function filtered(){
const mode=document.querySelector('#filter').value,q=(document.querySelector('#search').value||'').toLowerCase();
return (state.campaigns||[]).filter(v=>{
const st=v.campaign.effective_status||'';
if(mode==='live'&&!['ACTIVE','IN_PROCESS','WITH_ISSUES'].includes(st))return false;
if(mode==='paused'&&!st.includes('PAUSED'))return false;
return (v.campaign.name+' '+v.campaign.meta_object_id).toLowerCase().includes(q);
})}
function render(){
document.querySelector('#totals').innerHTML=totalsCards(state.totals||{});
document.querySelector('#table').innerHTML=campaignTable(filtered(),{withActions:true});
document.querySelectorAll('#table [data-action]').forEach(btn=>btn.onclick=()=>action(btn));
}
async function action(btn){
const id=btn.dataset.id,kind=btn.dataset.action;
if(kind==='guard')return openGuard(id);
btn.disabled=true;
try{await api('/app/api/campaigns/'+id+'/'+kind,{method:'POST'});await load()}catch(err){btn.disabled=false;btn.title=err.message;btn.textContent='Error'}
}
function openGuard(id){
const view=(state.campaigns||[]).find(v=>v.campaign.id===id);if(!view)return;
dialogTarget=view;
const dialog=document.querySelector('#guard-dialog');
document.querySelector('#guard-title').textContent='Guard · '+ (view.campaign.name||view.campaign.meta_object_id);
const own=view.guard&&view.guard.published_object_id===id;
document.querySelector('#guard-scope').textContent=view.guard?(own?'Персональные правила этой кампании.':'Сейчас действуют правила батча — сохранение создаст персональные правила для этой кампании.'):'Правил нет — сохранение создаст персональные правила для этой кампании.';
getCheckpoints=checkpointEditor(document.querySelector('#guard-editor'),view.guard?(view.guard.checkpoints||[]):[]);
document.querySelector('#guard-status').textContent='';
dialog.showModal();
}
document.querySelector('#guard-cancel').onclick=()=>document.querySelector('#guard-dialog').close();
document.querySelector('#guard-save').onclick=async()=>{
const out=document.querySelector('#guard-status');const checkpoints=getCheckpoints();
if(!checkpoints.length){out.textContent='Добавь хотя бы один чекпоинт со спендом';return}
const view=dialogTarget,own=view.guard&&view.guard.published_object_id===view.campaign.id;
try{
out.textContent='Saving…';
if(own)await api('/app/api/guards/'+view.guard.id,{method:'PATCH',body:{checkpoints}});
else await api('/app/api/campaigns/'+view.campaign.id+'/guard',{method:'POST',body:{checkpoints}});
document.querySelector('#guard-dialog').close();await load();
}catch(err){out.textContent=err.message}
};
document.querySelector('#filter').onchange=render;document.querySelector('#search').oninput=render;
load();setInterval(load,60000);
</script></body></html>
